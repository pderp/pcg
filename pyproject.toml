[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcg-fabricpc-experiments"
version = "0.1.0"
description = "External muP + residual block experiments for FabricPC predictive coding networks"
requires-python = ">=3.9"
dependencies = ["jax", "jaxlib", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
